<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFT 데이터 구축 통합 대시보드</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0f1117;color:#e0e0e0;display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:260px;background:#13151b;border-right:1px solid #2a2d35;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
.sb-title{padding:20px;font-size:1.1em;font-weight:700;color:#fff;border-bottom:1px solid #2a2d35}
.sb-section{padding:8px 12px;font-size:.72em;color:#555;text-transform:uppercase;letter-spacing:1px;margin-top:8px}
.sb-item{padding:11px 20px;cursor:pointer;font-size:.88em;color:#888;transition:all .15s;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
.sb-item:hover{background:#1a1d25;color:#ccc}
.sb-item.active{background:#1a1d25;color:#6c9fff;border-left-color:#6c9fff;font-weight:600}
.sb-item .sb-badge{font-size:.68em;padding:2px 7px;border-radius:8px;font-weight:600}
.sb-item .sb-badge.done{background:#1a332a;color:#4ecdc4}
.sb-item .sb-badge.wip{background:#2a2518;color:#ffd93d}
.sb-item .sb-badge.wait{background:transparent;color:#555;border:1px solid #2a2d35}

/* Main */
.main{margin-left:260px;flex:1;padding:24px 32px;min-height:100vh}
.page-title{font-size:1.5em;font-weight:700;color:#fff;margin-bottom:4px}
.page-desc{color:#888;font-size:.88em;margin-bottom:20px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid #2a2d35}
.tab{padding:11px 22px;cursor:pointer;border-radius:8px 8px 0 0;background:#1a1d25;color:#888;font-weight:600;transition:all .2s;font-size:.9em}
.tab.active{background:#2a2d35;color:#6c9fff;border-bottom:2px solid #6c9fff;margin-bottom:-2px}
.tab:hover{color:#fff}

/* Cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#1a1d25;border-radius:10px;padding:16px;text-align:center;border:1px solid #2a2d35}
.stat-card .num{font-size:1.7em;font-weight:700;color:#6c9fff}
.stat-card .label{color:#888;font-size:.8em;margin-top:3px}
.info-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:12px 16px;background:#1a1d25;border:1px solid #2a2d35;border-radius:8px}
.info-item{font-size:.84em;display:flex;gap:5px;align-items:center}
.info-item .il{color:#888}.info-item .iv{color:#6c9fff;font-weight:600}
.info-sep{width:1px;background:#2a2d35;margin:0 3px}

/* Task cards */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px;margin:16px 0}
.task-card{background:#1a1d25;border:1px solid #2a2d35;border-radius:10px;padding:18px;cursor:pointer;transition:all .2s}
.task-card:hover{border-color:#6c9fff;transform:translateY(-2px)}
.task-card .tc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.task-card .tc-id{font-size:.78em;color:#6c9fff;font-weight:700}
.task-card .tc-name{font-size:1em;font-weight:600;color:#fff;margin-bottom:3px}
.task-card .tc-desc{font-size:.8em;color:#888;margin-bottom:10px;line-height:1.4}
.task-card .tc-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:.8em}
.task-card .tc-stat .v{color:#6c9fff;font-weight:600}
.tc-progress{margin-top:10px}
.tc-progress-bar{height:5px;background:#2a2d35;border-radius:3px;overflow:hidden;margin-top:3px}
.tc-progress-fill{height:100%;border-radius:3px}
.tc-progress-label{font-size:.72em;color:#888;display:flex;justify-content:space-between}
.badge{font-size:.72em;padding:3px 10px;border-radius:10px;font-weight:600}
.badge.done{background:#1a332a;color:#4ecdc4}.badge.wip{background:#2a2518;color:#ffd93d}.badge.wait{background:#1a1d25;color:#666;border:1px solid #2a2d35}

/* Seed table */
.seed-table{width:100%;border-collapse:collapse;margin:10px 0}
.seed-table th{background:#12141a;padding:9px 12px;text-align:left;font-size:.8em;color:#6c9fff;border-bottom:2px solid #2a2d35}
.seed-table td{padding:9px 12px;border-bottom:1px solid #1a1d25;font-size:.83em;line-height:1.4}
.seed-table tr:hover{background:#1a1d25}
.seed-cat{color:#4ecdc4;font-size:.78em;font-weight:600}
.seed-safe{color:#4ecdc4;font-size:.82em}.seed-risk{color:#ffd93d;font-size:.82em}

/* Cross dims */
.dim-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.84em}
.dim-label{min-width:110px;color:#ccc}
.dim-bar-wrap{flex:1;height:20px;background:#12141a;border-radius:4px;position:relative;overflow:hidden}
.dim-bar{height:100%;border-radius:4px}
.dim-bar.ok{background:linear-gradient(90deg,#2a5a4a,#4ecdc4)}.dim-bar.under{background:linear-gradient(90deg,#5a3a1a,#ffd93d)}.dim-bar.over{background:linear-gradient(90deg,#2a3a5a,#6c9fff)}
.dim-target{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.4}
.dim-pct{min-width:100px;text-align:right;font-size:.8em;color:#888}

/* Turn chart */
.chart-wrap{margin:16px 0;padding:16px;background:#1a1d25;border:1px solid #2a2d35;border-radius:8px}
.chart-title{font-size:.85em;color:#ccc;margin-bottom:10px;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:0 4px}
.chart-group{display:flex;gap:2px;align-items:flex-end;flex:1}
.chart-bar{min-width:12px;border-radius:3px 3px 0 0;min-height:2px;cursor:default}
.chart-xlabel{font-size:.7em;color:#555;text-align:center;margin-top:4px}
.chart-col{display:flex;flex-direction:column;align-items:center;flex:1}
.chart-legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.chart-legend-item{font-size:.75em;color:#888;display:flex;align-items:center;gap:4px}
.chart-legend-dot{width:8px;height:8px;border-radius:2px}

/* Distribution */
.dist-row{margin:14px 0}
.dist-label{font-size:.84em;color:#ccc;margin-bottom:5px}
.dist-bar{display:flex;height:22px;border-radius:5px;overflow:hidden}
.dist-seg{display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:600}
.domain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin:10px 0}
.domain-chip{background:#12141a;border:1px solid #2a2d35;border-radius:5px;padding:7px 10px;display:flex;justify-content:space-between;font-size:.8em}
.domain-chip .dc-n{color:#ccc}.domain-chip .dc-v{color:#6c9fff;font-weight:600}

/* Pipeline */
.pipeline{display:flex;align-items:center;gap:8px;margin:16px 0;overflow-x:auto;padding:8px 0}
.pipe-step{background:#1a1d25;border:2px solid #2a2d35;border-radius:10px;padding:12px 16px;min-width:150px;text-align:center;flex-shrink:0}
.pipe-step.p-done{border-color:#4ecdc4}.pipe-step.p-wip{border-color:#ffd93d}
.pipe-step .step-num{font-size:.7em;color:#6c9fff;font-weight:700}
.pipe-step .step-name{font-size:.86em;font-weight:600;margin:3px 0;color:#fff}
.pipe-step .step-detail{font-size:.7em;color:#888;line-height:1.4}
.pipe-step .step-badge{margin-top:6px}
.pipe-arrow{color:#444;font-size:1.1em;flex-shrink:0}
.ov-pipe-table{width:100%;border-collapse:collapse;margin:16px 0}
.ov-pipe-table th{background:#1a1d25;padding:9px 12px;text-align:left;font-size:.82em;color:#6c9fff;border-bottom:2px solid #2a2d35}
.ov-pipe-table td{padding:10px 12px;border-bottom:1px solid #1a1d25;font-size:.83em}
.ov-pipe-table tr:hover{background:#1a1d25}
.mini-step{border-radius:4px;padding:2px 7px;font-size:.76em}
.mini-step.ms-done{background:#1a332a;color:#4ecdc4}.mini-step.ms-wip{background:#2a2518;color:#ffd93d}.mini-step.ms-wait{background:#12141a;color:#555;border:1px solid #2a2d35}

/* Issues */
.issue-list{margin:10px 0}
.issue-item{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:#1a1d25;border:1px solid #2a2d35;border-radius:7px;margin-bottom:6px;font-size:.84em}
.issue-sev{font-size:.7em;padding:2px 7px;border-radius:4px;font-weight:600;flex-shrink:0;margin-top:1px}
.issue-sev.error{background:#3a1a1a;color:#ff6b6b}.issue-sev.warn{background:#2a2518;color:#ffd93d}.issue-sev.info{background:#1a2535;color:#6c9fff}
.issue-text{flex:1;line-height:1.4}.issue-date{color:#555;font-size:.76em;flex-shrink:0}

/* Samples */
.sample-selector{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.sample-btn{padding:9px 16px;border-radius:7px;border:1px solid #2a2d35;background:#1a1d25;color:#e0e0e0;cursor:pointer;font-size:.84em;transition:all .15s}
.sample-btn.active{border-color:#6c9fff;color:#6c9fff;background:#1a1d2f}.sample-btn:hover{border-color:#6c9fff}
.meta-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.meta-tag{background:#1a1d25;border:1px solid #2a2d35;border-radius:5px;padding:4px 9px;font-size:.76em}
.meta-tag.accent{border-color:#6c9fff;color:#6c9fff}.meta-tag.teal{border-color:#4ecdc4;color:#4ecdc4}.meta-tag.coral{border-color:#ff6b6b;color:#ff6b6b}.meta-tag.yellow{border-color:#ffd93d;color:#ffd93d}
.chat-area{background:#1a1d25;border-radius:10px;padding:18px;max-height:550px;overflow-y:auto}
.msg{margin-bottom:14px}
.msg.system{background:#12141a;border-radius:7px;padding:10px;font-size:.78em;color:#666;max-height:70px;overflow:hidden;cursor:pointer;transition:max-height .3s}
.msg.system.expanded{max-height:3000px}
.msg.system::after{content:'(클릭하여 펼치기)';display:block;color:#444;font-size:.76em;margin-top:3px}
.msg.system.expanded::after{content:'(클릭하여 접기)'}
.msg .role{font-size:.7em;font-weight:700;margin-bottom:3px}
.msg .role.user-role{color:#4ecdc4}.msg .role.asst-role{color:#ff6b6b}
.msg .content{line-height:1.6;font-size:.86em;white-space:pre-wrap}
.msg .think-block{background:#0a0c10;border-left:3px solid #6c9fff;padding:7px 10px;margin-bottom:7px;border-radius:0 5px 5px 0;font-size:.78em;color:#8899aa}
.section-title{font-size:1em;font-weight:700;margin:20px 0 10px;color:#fff;padding-bottom:6px;border-bottom:1px solid #2a2d35}
.empty-state{text-align:center;color:#555;padding:50px 20px;font-size:.9em}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar"></nav>
<div class="main">
  <div class="page-title" id="pageTitle">전체 요약</div>
  <div class="page-desc" id="pageDesc">G4 태스크별 데이터 구축 현황</div>
  <div class="tabs">
    <div class="tab active" onclick="onTab('dashboard',this)">대시보드</div>
    <div class="tab" onclick="onTab('pipeline',this)">구축 프로세스</div>
    <div class="tab" onclick="onTab('samples',this)">구축 예시</div>
  </div>
  <div id="content"></div>
</div>
<script>
const DIM_COLORS=['#4ecdc4','#6c9fff','#ffd93d','#ff6b6b','#c084fc','#fb923c'];
const TASK_IDS=['G4-1','G4-2','G4-3','G4-4','G4-5','G4-6'];
let TASKS=[];
let curTask='__all__',curTab='dashboard';

// ═══ 데이터 소스 설정 ═══
// Google Sheets 연동: SHEET_ID를 넣으면 시트에서 로드, 비우면 JSON 파일 사용
const SHEET_ID = '1y6OEISDUfad_NaM7Jx0kYNaxk5fSVOHUK_LVIIiEYXw';

// ═══ CSV 파서 ═══
function parseCSV(text){
  const rows=[];let cur=[];let field='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){if(c==='"'&&text[i+1]==='"'){field+='"';i++;}else if(c==='"')inQ=false;else field+=c;}
    else{if(c==='"')inQ=true;else if(c===','){cur.push(field.trim());field='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;cur.push(field.trim());if(cur.some(v=>v))rows.push(cur);cur=[];field='';}else field+=c;}
  }
  cur.push(field.trim());if(cur.some(v=>v))rows.push(cur);
  if(!rows.length)return[];
  const hdr=rows[0];
  return rows.slice(1).map(r=>{const o={};hdr.forEach((h,i)=>o[h]=r[i]||'');return o;});
}

function sheetURL(tab){return`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;}

// ═══ Google Sheets에서 로드 ═══
async function loadFromSheets(){
  const [tasksCSV,seedsCSV,pipeCSV,issuesCSV,dimsCSV]=await Promise.all(
    ['tasks','seeds','pipeline','issues','crossDims'].map(tab=>fetch(sheetURL(tab)).then(r=>r.text()).catch(()=>'')));
  const tasksR=parseCSV(tasksCSV), seedsR=parseCSV(seedsCSV), pipeR=parseCSV(pipeCSV), issuesR=parseCSV(issuesCSV), dimsR=parseCSV(dimsCSV);

  // JSON 파일에서 samples 로드 (시트에 넣기 어려운 데이터)
  const samplesMap={};
  const sr=await Promise.allSettled(TASK_IDS.map(id=>fetch('data/summary_'+id+'.json').then(r=>r.ok?r.json():null)));
  sr.forEach(r=>{if(r.status==='fulfilled'&&r.value)samplesMap[r.value.id]=r.value.samples||[];});

  TASKS=tasksR.map(row=>{
    const id=row.id;
    return {
      id, name:row.name||'', desc:row.desc||'', status:row.status||'wait',
      info:{tier:+row.tier||0,target:+row.target||0,minimum:+row.minimum||0,lang_ratio:row.lang_ratio||'',cot_ratio:row.cot_ratio||''},
      seeds:seedsR.filter(s=>s.task_id===id).map(s=>({name:s.name,category:s.category,usage:s.usage,contamination:s.contamination||'-'})),
      crossDims:dimsR.filter(d=>d.task_id===id).map(d=>({name:d.name,target:+d.target||0,actual:+d.actual||0,turnDist:{}})),
      dataStats:{completed:+row.completed||0,pass_rate:+row.pass_rate||0,avg_turns:+row.avg_turns||0,
        lang:row.lang_ratio?parseLangRatio(row.lang_ratio):{},cot:row.cot_ratio?parseCotRatio(row.cot_ratio):{},domains:[]},
      pipeline:pipeR.filter(p=>p.task_id===id).map(p=>({phase:p.phase,name:p.name,detail:(p.detail||'').replace(/\\n/g,'\n'),status:p.status||'wait'})),
      issues:issuesR.filter(i=>i.task_id===id).map(i=>({severity:i.severity||'info',text:i.text||'',date:i.date||''})),
      samples:samplesMap[id]||[]
    };
  });
}

function parseLangRatio(s){const m=s.match(/(\d+)\s*:\s*(\d+)/);if(!m)return{};if(s.includes('EN:KO'))return{EN:+m[1],KO:+m[2]};if(s.includes('KO'))return{KO:100};return{EN:+m[1],KO:+m[2]};}
function parseCotRatio(s){const t=s.match(/think\s*(\d+)/i);const n=s.match(/no_think\s*(\d+)/i);return{think:t?+t[1]:0,no_think:n?+n[1]:0};}

// ═══ JSON 파일에서 로드 (Google Sheets 미설정 시) ═══
async function loadFromJSON(){
  const r=await Promise.allSettled(TASK_IDS.map(id=>fetch('data/summary_'+id+'.json').then(r=>{if(!r.ok)throw 0;return r.json();})));
  r.forEach(x=>{if(x.status==='fulfilled')TASKS.push(x.value);});
}

// ═══ 통합 로더 ═══
async function loadTasks(){
  TASKS=[];
  if(SHEET_ID) await loadFromSheets(); else await loadFromJSON();
  // 사이드바 빌드
  const sb=document.getElementById('sidebar');
  let h='<div class="sb-title">SFT 데이터 구축</div>';
  h+='<div class="sb-item active" data-id="__all__" onclick="onNav(\'__all__\')">전체 요약</div>';
  h+='<div class="sb-section">태스크</div>';
  TASKS.forEach(t=>{const bl={done:'완료',wip:'진행중',wait:'대기'}[t.status]||'?';
    h+=`<div class="sb-item" data-id="${t.id}" onclick="onNav('${t.id}')"><span>${t.id} ${t.name}</span><span class="sb-badge ${t.status}">${bl}</span></div>`;});
  sb.innerHTML=h; render();
}
loadTasks();

function onNav(id){
  curTask=id;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  if(id==='__all__'){document.getElementById('pageTitle').textContent='전체 요약';document.getElementById('pageDesc').textContent='G4 태스크별 데이터 구축 현황';}
  else{const t=TASKS.find(x=>x.id===id);document.getElementById('pageTitle').textContent=`${t.id} ${t.name}`;document.getElementById('pageDesc').textContent=t.desc;}
  render();
}
function onTab(tab,el){curTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}
function render(){
  const el=document.getElementById('content');
  if(curTask==='__all__') el.innerHTML={dashboard:rvOvDash,pipeline:rvOvPipe,samples:rvOvSamples}[curTab]();
  else{const t=TASKS.find(x=>x.id===curTask);if(!t)return;el.innerHTML={dashboard:()=>rvDash(t),pipeline:()=>rvPipe(t),samples:()=>rvSamples(t)}[curTab]();}
}

function badge(s){const m={done:['완료','done'],wip:['진행중','wip'],wait:['대기','wait']};const[t,c]=m[s]||['?','wait'];return`<span class="badge ${c}">${t}</span>`;}
function pct(n,d){return d?Math.round(n/d*100):0;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function pColor(p){return p>=80?'#4ecdc4':p>=40?'#ffd93d':'#ff6b6b';}
function num(n){return(n||0).toLocaleString();}

// ── OVERVIEW ──
function rvOvDash(){
  const tT=TASKS.reduce((a,t)=>a+(t.info?.target||0),0),tM=TASKS.reduce((a,t)=>a+(t.info?.minimum||0),0),tD=TASKS.reduce((a,t)=>a+(t.dataStats?.completed||0),0);
  const nD=TASKS.filter(t=>t.status==='done').length,nW=TASKS.filter(t=>t.status==='wip').length,nWt=TASKS.filter(t=>t.status==='wait').length;
  let h=`<div class="info-bar"><div class="info-item"><span class="il">태스크</span><span class="iv">${TASKS.length}개</span></div><div class="info-sep"></div><div class="info-item"><span class="il">전체 목표</span><span class="iv">${num(tT)}</span></div><div class="info-sep"></div><div class="info-item"><span class="il">전체 최소</span><span class="iv">${num(tM)}</span></div><div class="info-sep"></div><div class="info-item"><span class="il">완료</span><span class="iv">${num(tD)} (${pct(tD,tT)}%)</span></div><div class="info-sep"></div><div class="info-item"><span class="il">상태</span><span class="iv">${nD}완료/${nW}진행/${nWt}대기</span></div></div>`;
  h+=`<div class="stats-grid"><div class="stat-card"><div class="num">${num(tT)}</div><div class="label">전체 목표</div></div><div class="stat-card"><div class="num">${num(tM)}</div><div class="label">전체 최소</div></div><div class="stat-card"><div class="num">${num(tD)}</div><div class="label">현재 완료</div></div><div class="stat-card"><div class="num">${pct(tD,tT)}%</div><div class="label">진행률</div></div></div>`;
  h+='<div class="section-title">태스크 목록</div><div class="task-grid">';
  TASKS.forEach(t=>{const p=pct(t.dataStats?.completed||0,t.info?.target||1);
    h+=`<div class="task-card" onclick="onNav('${t.id}')"><div class="tc-header"><span class="tc-id">${t.id} · Tier ${t.info?.tier||'?'}</span>${badge(t.status)}</div><div class="tc-name">${t.name}</div><div class="tc-desc">${t.desc}</div><div class="tc-stats"><span class="tc-stat">목표 <span class="v">${num(t.info?.target)}</span></span><span class="tc-stat">최소 <span class="v">${num(t.info?.minimum)}</span></span><span class="tc-stat">언어 <span class="v">${t.info?.lang_ratio||'-'}</span></span></div><div class="tc-progress"><div class="tc-progress-label"><span>${p}%</span><span>${num(t.dataStats?.completed)}/${num(t.info?.target)}</span></div><div class="tc-progress-bar"><div class="tc-progress-fill" style="width:${p}%;background:${pColor(p)}"></div></div></div></div>`;});
  return h+'</div>';
}
function rvOvPipe(){
  let h='<div class="section-title">파이프라인 진행 현황</div><table class="ov-pipe-table"><tr><th>태스크</th><th>Tier</th><th>상태</th><th>시드 구축</th><th>시드 검증</th><th>대화 생성</th><th>품질 검증</th></tr>';
  TASKS.forEach(t=>{h+=`<tr><td><strong>${t.id}</strong> ${t.name}</td><td>Tier ${t.info?.tier||'?'}</td><td>${badge(t.status)}</td>`;
    t.pipeline.forEach(p=>h+=`<td><span class="mini-step ms-${p.status}">${{done:'완료',wip:'진행중',wait:'대기'}[p.status]}</span></td>`);h+='</tr>';});
  h+='</table>';
  TASKS.forEach(t=>{h+=`<div class="section-title">${t.id} ${t.name}</div>`+mkPipeline(t.pipeline);});
  return h;
}
function rvOvSamples(){
  let h='<div class="section-title">태스크별 대표 샘플</div>';
  TASKS.forEach(t=>{h+=`<div class="section-title" style="font-size:.92em;color:#6c9fff;cursor:pointer" onclick="onNav('${t.id}')">${t.id} ${t.name} &rarr;</div>`;
    if(!t.samples?.length){h+='<div class="empty-state" style="padding:20px">아직 샘플이 없습니다.</div>';return;}
    h+=mkChat(t.samples[0],true);});
  return h;
}

// ── TASK DASHBOARD ──
function rvDash(t){
  const inf=t.info||{},ds=t.dataStats||{},p=pct(ds.completed||0,inf.target||1);
  let h=`<div class="info-bar"><div class="info-item"><span class="il">Tier</span><span class="iv">${inf.tier||'?'}</span></div><div class="info-sep"></div><div class="info-item"><span class="il">목표</span><span class="iv">${num(inf.target)}</span></div><div class="info-sep"></div><div class="info-item"><span class="il">최소</span><span class="iv">${num(inf.minimum)}</span></div><div class="info-sep"></div><div class="info-item"><span class="il">언어</span><span class="iv">${inf.lang_ratio||'-'}</span></div><div class="info-sep"></div><div class="info-item"><span class="il">CoT</span><span class="iv">${inf.cot_ratio||'-'}</span></div></div>`;
  h+=`<div class="stats-grid"><div class="stat-card"><div class="num">${num(ds.completed)}</div><div class="label">완료 (${p}%)</div></div><div class="stat-card"><div class="num">${ds.pass_rate||0}%</div><div class="label">통과율</div></div><div class="stat-card"><div class="num">${ds.avg_turns||'-'}</div><div class="label">평균 턴 수</div></div><div class="stat-card"><div class="num">${t.seeds?.length||0}</div><div class="label">시드 종류</div></div></div>`;
  h+='<div class="section-title">시드 데이터</div><table class="seed-table"><tr><th>데이터셋</th><th>분류</th><th>사용 방식</th><th>오염 위험 비고</th></tr>';
  (t.seeds||[]).forEach(s=>{const cc=s.contamination==='-'||(s.contamination||'').includes('없음')?'seed-safe':'seed-risk';
    h+=`<tr><td style="font-weight:600">${s.name}</td><td><span class="seed-cat">${s.category}</span></td><td style="color:#aaa">${s.usage}</td><td class="${cc}">${s.contamination}</td></tr>`;});
  h+='</table>';

  if(t.crossDims?.length){
    h+='<div class="section-title">횡단차원 매트릭스</div>';
    t.crossDims.forEach(d=>{const cls=d.actual===0?'under':Math.abs(d.actual-d.target)<=3?'ok':d.actual<d.target?'under':'over';const df=d.actual-d.target;
      h+=`<div class="dim-row"><span class="dim-label">${d.name}</span><div class="dim-bar-wrap"><div class="dim-bar ${cls}" style="width:${d.actual}%"></div><div class="dim-target" style="left:${d.target}%"></div></div><span class="dim-pct">${d.actual}% (목표 ${d.target}%, ${df>0?'+':''}${df})</span></div>`;});
    // Turn distribution chart
    const allT=new Set();t.crossDims.forEach(d=>Object.keys(d.turnDist||{}).forEach(k=>allT.add(+k)));
    const turns=[...allT].sort((a,b)=>a-b);
    if(turns.length){
      const maxV=Math.max(...t.crossDims.flatMap(d=>Object.values(d.turnDist||{})),1);
      h+='<div class="chart-wrap"><div class="chart-title">횡단차원별 턴 수 분포 (X: 턴 수 / Y: 수량)</div><div class="chart">';
      turns.forEach(tn=>{h+='<div class="chart-col"><div class="chart-group">';
        t.crossDims.forEach((d,i)=>{const v=(d.turnDist||{})[tn]||0;const hp=Math.round(v/maxV*100);
          h+=`<div class="chart-bar" style="height:${hp}%;background:${DIM_COLORS[i%DIM_COLORS.length]}" title="${d.name}: ${v}건"></div>`;});
        h+=`</div><div class="chart-xlabel">${tn}턴</div></div>`;});
      h+='</div><div class="chart-legend">';
      t.crossDims.forEach((d,i)=>{const tot=Object.values(d.turnDist||{}).reduce((a,v)=>a+v,0);
        h+=`<span class="chart-legend-item"><span class="chart-legend-dot" style="background:${DIM_COLORS[i%DIM_COLORS.length]}"></span>${d.name} (${tot}건)</span>`;});
      h+='</div></div>';}}

  if(ds.lang&&Object.keys(ds.lang).length){
    h+='<div class="section-title">분포</div>';
    const lE=Object.entries(ds.lang),lT=lE.reduce((a,[,v])=>a+v,0),lC={KO:'#4ecdc4',EN:'#ff6b6b'};
    h+='<div class="dist-row"><div class="dist-label">언어 분포</div><div class="dist-bar">';
    lE.forEach(([k,v])=>h+=`<div class="dist-seg" style="width:${pct(v,lT)}%;background:${lC[k]||'#6c9fff'}">${k} ${pct(v,lT)}%</div>`);h+='</div></div>';
    if(ds.cot){const cE=Object.entries(ds.cot),cT=cE.reduce((a,[,v])=>a+v,0),cC={think:'#4ecdc4',no_think:'#ff6b6b'};
      h+='<div class="dist-row"><div class="dist-label">CoT 분포</div><div class="dist-bar">';
      cE.forEach(([k,v])=>h+=`<div class="dist-seg" style="width:${pct(v,cT)}%;background:${cC[k]||'#6c9fff'}">${k} ${pct(v,cT)}%</div>`);h+='</div></div>';}
    if(ds.domains?.length){h+='<div class="dist-row"><div class="dist-label">도메인 분포</div><div class="domain-grid">';
      ds.domains.sort((a,b)=>b.count-a.count).forEach(d=>h+=`<div class="domain-chip"><span class="dc-n">${d.name}</span><span class="dc-v">${d.count}</span></div>`);h+='</div></div>';}}

  if(t.issues?.length){h+='<div class="section-title">이슈</div><div class="issue-list">';
    t.issues.forEach(i=>h+=`<div class="issue-item"><span class="issue-sev ${i.severity}">${i.severity.toUpperCase()}</span><span class="issue-text">${i.text}</span><span class="issue-date">${i.date}</span></div>`);h+='</div>';}
  return h;
}

// ── TASK PIPELINE ──
function mkPipeline(steps){let h='<div class="pipeline">';
  steps.forEach((p,i)=>{if(i)h+='<div class="pipe-arrow">&rarr;</div>';
    h+=`<div class="pipe-step p-${p.status}"><div class="step-num">${p.phase}</div><div class="step-name">${p.name}</div><div class="step-detail">${esc(p.detail)}</div><div class="step-badge">${badge(p.status)}</div></div>`;});
  return h+'</div>';}
function rvPipe(t){
  const dn=t.pipeline.filter(p=>p.status==='done').length;
  let h=`<div class="section-title">구축 프로세스 (${dn}/${t.pipeline.length} 완료)</div>`+mkPipeline(t.pipeline);
  if(t.issues?.length){h+='<div class="section-title">이슈</div><div class="issue-list">';
    t.issues.forEach(i=>h+=`<div class="issue-item"><span class="issue-sev ${i.severity}">${i.severity.toUpperCase()}</span><span class="issue-text">${i.text}</span><span class="issue-date">${i.date}</span></div>`);h+='</div>';}
  return h;
}

// ── TASK SAMPLES ──
function rvSamples(t){
  if(!t.samples?.length)return'<div class="empty-state">아직 구축된 샘플이 없습니다.</div>';
  let h='<div class="sample-selector">';
  t.samples.forEach((s,i)=>h+=`<div class="sample-btn ${i===0?'active':''}" onclick="showSample('${t.id}',${i},this)">${s.label}</div>`);
  return h+'</div><div id="sv">'+mkChat(t.samples[0],true)+'</div>';}
function showSample(tid,idx,el){document.querySelectorAll('.sample-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');
  document.getElementById('sv').innerHTML=mkChat(TASKS.find(t=>t.id===tid).samples[idx],true);}
function mkChat(sample,showTags){let h='';
  if(showTags&&sample.tags){h+='<div class="meta-bar">';sample.tags.forEach(t=>h+=`<div class="meta-tag ${t.style||''}">${t.text}</div>`);h+='</div>';}
  h+='<div class="chat-area">';
  (sample.messages||[]).forEach(m=>{if(m.role==='system')h+=`<div class="msg system" onclick="this.classList.toggle('expanded')"><div class="role">SYSTEM</div><div class="content">${esc(m.content)}</div></div>`;
    else{const rc=m.role==='user'?'user-role':'asst-role',rn=m.role==='user'?'USER':'ASSISTANT';
      h+=`<div class="msg"><div class="role ${rc}">${rn}</div><div class="content">${mkThink(m.content)}</div></div>`;}});
  return h+'</div>';}
function mkThink(text){if(!text)return'';const parts=[];let last=0;const re=/<think>([\s\S]*?)<\/think>/g;let m;
  while((m=re.exec(text))!==null){if(m.index>last)parts.push(esc(text.slice(last,m.index)));parts.push('<div class="think-block">'+esc(m[1])+'</div>');last=re.lastIndex;}
  if(last<text.length)parts.push(esc(text.slice(last)));return parts.join('');}
</script>
